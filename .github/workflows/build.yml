name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle executable
        working-directory: RaceConditionGate
        run: chmod +x gradlew

      - name: Build
        working-directory: RaceConditionGate
        run: ./gradlew build
